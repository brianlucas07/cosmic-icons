<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Tampa superior da lixeira -->
    <linearGradient id="trash-lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#68707d"/>
      <stop offset="100%" stop-color="#4b525d"/>
    </linearGradient>

    <!-- Corpo principal da lixeira (Cinza metálico suave) -->
    <linearGradient id="trash-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ca4b2"/>
      <stop offset="100%" stop-color="#7d8594"/>
    </linearGradient>

    <!-- Sombra suave de profundidade -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Alça superior da tampa -->
  <path d="M 104 46 V 36 C 104 30.5 108.5 26 114 26 H 142 C 147.5 26 152 30.5 152 36 V 46"
        fill="none" stroke="url(#trash-lid)" stroke-width="10" stroke-linecap="round"/>

  <!-- Tampa arredondada da lixeira -->
  <rect x="44" y="42" width="168" height="24" rx="12" ry="12"
        fill="url(#trash-lid)"/>

  <!-- Corpo da lixeira com curvatura squircle moderna -->
  <path d="M 54 74 C 54 67.4 59.4 62 66 62 H 190 C 196.6 62 202 67.4 202 74 L 192 202 C 190.8 216.6 178.6 228 164 228 H 92 C 77.4 228 65.2 216.6 64 202 L 54 74 Z"
        fill="url(#trash-body)"
        filter="url(#shadow)"/>

  <!-- Friso de luz contínuo na borda superior do corpo -->
  <path d="M 72 68 L 184 68"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Sulcos verticais em baixo-relevo -->
  <g stroke="#4b525d" stroke-width="8" stroke-linecap="round" opacity="0.45">
    <line x1="98" y1="100" x2="102" y2="192"/>
    <line x1="128" y1="100" x2="128" y2="192"/>
    <line x1="158" y1="100" x2="154" y2="192"/>
  </g>
</svg>