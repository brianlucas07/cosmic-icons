<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Céu atmosférico azul cósmico -->
    <linearGradient id="sky-chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Sol Radiante em Âmbar Solar -->
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Nuvem Volumétrica Acetinada -->
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>

    <filter id="cloud-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#sky-chassis)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Halo Solar e Disco do Sol -->
  <circle cx="102" cy="100" r="42" fill="#fbbf24" opacity="0.22"/>
  <circle cx="102" cy="100" r="32" fill="url(#sun-grad)"/>

  <!-- Nuvem Cumulus Volumétrica em Primeiro Plano -->
  <path d="M 88 168 H 170 C 185.5 168 198 155.5 198 140 C 198 126.2 188 114.7 174.8 112.4 C 169.6 93.8 152.5 80 132 80 C 109.2 80 90.4 97.2 88.2 119.4 C 75.6 121.8 66 132.8 66 146 C 66 158.2 75.8 168 88 168 Z"
        fill="url(#cloud-grad)"
        filter="url(#cloud-shadow)"/>

  <!-- Gotas de Chuva / Precipitação em Ciano Elétrico -->
  <g stroke="#38bdf8" stroke-width="5" stroke-linecap="round">
    <line x1="98" y1="184" x2="92" y2="196"/>
    <line x1="128" y1="184" x2="122" y2="196"/>
    <line x1="158" y1="184" x2="152" y2="196"/>
  </g>
</svg>
