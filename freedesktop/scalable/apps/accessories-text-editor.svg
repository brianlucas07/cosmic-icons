<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi do documento/editor de código -->
    <linearGradient id="edit-chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Superfície interna escura de edição -->
    <linearGradient id="edit-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#0b172a"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Chassi principal do documento de código (rx 28) -->
  <rect x="36" y="30" width="184" height="196" rx="28" ry="28"
        fill="url(#edit-chassis)"
        filter="url(#shadow)"/>

  <!-- Painel interno escuro de edição (rx 20) -->
  <rect x="52" y="46" width="152" height="164" rx="20" ry="20"
        fill="url(#edit-screen)"/>

  <!-- Pontos sutis de controle no topo -->
  <circle cx="70" cy="64" r="3.5" fill="#ef4444" opacity="0.75"/>
  <circle cx="82" cy="64" r="3.5" fill="#f59e0b" opacity="0.75"/>
  <circle cx="94" cy="64" r="3.5" fill="#10b981" opacity="0.75"/>

  <!-- Linhas de código / sintaxe moderna iluminada -->
  <!-- Linha 1: Palavra-chave âmbar + Identificador ciano -->
  <rect x="68" y="88" width="42" height="6" rx="3" fill="#f59e0b"/>
  <rect x="116" y="88" width="54" height="6" rx="3" fill="#38bdf8"/>

  <!-- Linha 2 (Indentada): Função mint + argumento suave -->
  <rect x="80" y="108" width="48" height="6" rx="3" fill="#10b981"/>
  <rect x="134" y="108" width="34" height="6" rx="3" fill="#e0f2fe" opacity="0.85"/>

  <!-- Linha 3 (Indentada): String / Conteúdo -->
  <rect x="80" y="128" width="68" height="6" rx="3" fill="#e0f2fe" opacity="0.85"/>

  <!-- Linha 4: Fechamento + Cursor vertical nítido -->
  <rect x="68" y="148" width="24" height="6" rx="3" fill="#38bdf8" opacity="0.9"/>
  <rect x="98" y="145" width="4" height="12" rx="2" fill="#ffffff"/>

  <!-- Linha 5: Código secundário suave -->
  <rect x="68" y="168" width="56" height="5" rx="2.5" fill="#64748b" opacity="0.45"/>

  <!-- Brilho sutil contínuo na curvatura superior -->
  <path d="M 64 36 L 192 36"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
</svg>
