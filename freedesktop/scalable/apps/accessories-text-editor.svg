<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi do módulo de código espacial -->
    <linearGradient id="edit-chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Superfície interna de edição / tela escura -->
    <linearGradient id="edit-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060e1c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Caneta óptica / Stylus espacial em titânio -->
    <linearGradient id="stylus-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Chassi principal do tablet de dados (rx 28) -->
  <rect x="32" y="34" width="192" height="188" rx="28" ry="28"
        fill="url(#edit-chassis)"
        filter="url(#shadow)"/>

  <!-- Painel interno escuro de edição (rx 20) -->
  <rect x="46" y="48" width="134" height="160" rx="20" ry="20"
        fill="url(#edit-screen)"/>

  <!-- Linhas de código / sintaxe retrô-espacial iluminada -->
  <!-- Linha 1: Palavra-chave âmbar + Identificador ciano -->
  <rect x="62" y="68" width="36" height="6" rx="3" fill="#f59e0b"/>
  <rect x="104" y="68" width="52" height="6" rx="3" fill="#38bdf8"/>

  <!-- Linha 2 (Indentada): Função mint + argumento branco -->
  <rect x="74" y="86" width="44" height="6" rx="3" fill="#10b981"/>
  <rect x="124" y="86" width="32" height="6" rx="3" fill="#e0f2fe" opacity="0.85"/>

  <!-- Linha 3 (Indentada): String literal solar -->
  <rect x="74" y="104" width="60" height="6" rx="3" fill="#fb923c"/>

  <!-- Linha 4: Fechamento + Cursor cósmico piscando -->
  <rect x="62" y="122" width="20" height="6" rx="3" fill="#38bdf8" opacity="0.9"/>
  <rect x="88" y="120" width="4" height="10" rx="2" fill="#ffffff"/>

  <!-- Linha 5: Código secundário suave -->
  <rect x="62" y="140" width="48" height="5" rx="2.5" fill="#0284c7" opacity="0.5"/>

  <!-- Faixas retrô-espaciais no painel inferior (Mission Stripes) -->
  <rect x="62" y="184" width="44" height="5" rx="2.5" fill="#f59e0b"/>
  <rect x="62" y="192" width="32" height="5" rx="2.5" fill="#38bdf8"/>

  <!-- Compartimento acoplado da Stylus óptica (à direita) -->
  <rect x="188" y="58" width="22" height="140" rx="11" ry="11" fill="#0b1329" fill-opacity="0.4"/>
  <!-- Corpo da Stylus -->
  <rect x="193" y="66" width="12" height="114" rx="6" ry="6" fill="url(#stylus-body)"/>
  <!-- Ponta e LED óptico da caneta -->
  <circle cx="199" cy="74" r="3.5" fill="#38bdf8"/>
  <circle cx="199" cy="74" r="1.5" fill="#ffffff"/>
  <path d="M 193 166 L 199 178 L 205 166 Z" fill="#f59e0b"/>

  <!-- Brilho sutil contínuo na curvatura superior -->
  <path d="M 58 40 L 198 40"
        stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
