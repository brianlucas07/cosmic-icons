<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Monitor Remoto em Ciano Vibrante a Azul Cósmico -->
    <linearGradient id="node-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Trilhas de Conexão Remota -->
  <path d="M 92 98 L 164 158 M 164 98 L 92 158"
        stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="6 6" opacity="0.55"/>

  <!-- Terminal Remoto Superior Esquerdo -->
  <rect x="58" y="64" width="68" height="50" rx="10" fill="#091526" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="92" cy="89" r="6" fill="#38bdf8"/>

  <!-- Terminal Principal Inferior Direito (Ativo) -->
  <rect x="122" y="130" width="76" height="56" rx="12" fill="url(#node-cyan)"/>
  <rect x="134" y="142" width="52" height="32" rx="6" fill="#091526"/>
  <circle cx="160" cy="158" r="7" fill="#fbbf24"/>

  <!-- Nós Secundários de Rede -->
  <circle cx="168" cy="88" r="14" fill="#0284c7" stroke="#7dd3fc" stroke-width="2.5"/>
  <circle cx="84" cy="164" r="14" fill="#0284c7" stroke="#7dd3fc" stroke-width="2.5"/>
</svg>
