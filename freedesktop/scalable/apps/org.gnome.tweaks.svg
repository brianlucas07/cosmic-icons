<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Trilho ativo Ciano -->
    <linearGradient id="track-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Trilho ativo Âmbar -->
    <linearGradient id="track-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Slider Superior (Ativo à Direita - Ciano) -->
  <rect x="64" y="84" width="128" height="28" rx="14" fill="url(#track-cyan)"/>
  <circle cx="176" cy="98" r="11" fill="#ffffff"/>

  <!-- Slider Inferior (Ativo à Esquerda - Âmbar) -->
  <rect x="64" y="144" width="128" height="28" rx="14" fill="#091526" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="64" y="144" width="68" height="28" rx="14" fill="url(#track-amber)"/>
  <circle cx="116" cy="158" r="11" fill="#ffffff"/>
</svg>
