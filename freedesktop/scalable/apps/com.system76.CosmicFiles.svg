<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Degradê da placa traseira (Azul espacial profundo) -->
    <linearGradient id="back-folder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Degradê do corpo frontal (Ciano cósmico a azul profundo) -->
    <linearGradient id="front-folder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Cartucho de dados interno -->
    <linearGradient id="data-cartridge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Placa traseira da pasta modular espacial -->
  <path d="M 36 64 C 36 48 48 36 64 36 L 100 36 C 112 36 122 46 128 56 L 134 66 C 140 76 148 82 160 82 L 192 82 C 208 82 220 94 220 110 L 220 194 C 220 210 208 222 192 222 L 64 222 C 48 222 36 210 36 194 Z"
        fill="url(#back-folder)"/>

  <!-- Cartucho de dados / Módulo holográfico espiando -->
  <rect x="58" y="58" width="140" height="92" rx="16" ry="16" fill="url(#data-cartridge)"/>
  <!-- Faixa de leitura óptica no cartucho -->
  <rect x="74" y="72" width="70" height="6" rx="3" fill="#0284c7" opacity="0.8"/>
  <rect x="74" y="84" width="40" height="5" rx="2.5" fill="#94a3b8"/>
  <!-- Ponto ótico holográfico -->
  <circle cx="174" cy="78" r="8" fill="#38bdf8" opacity="0.9"/>
  <circle cx="174" cy="78" r="4" fill="#ffffff"/>

  <!-- Corpo frontal modular com cantos bem arredondados (rx 28) -->
  <rect x="36" y="96" width="184" height="126" rx="28" ry="28"
        fill="url(#front-folder)"
        filter="url(#shadow)"/>

  <!-- Faixas retrô-espaciais (Decalque Mission Stripes estilo 70s sci-fi) -->
  <rect x="42" y="186" width="56" height="5" rx="2.5" fill="#f59e0b"/>
  <rect x="42" y="195" width="44" height="5" rx="2.5" fill="#38bdf8"/>

  <!-- Visor / Placa modular de identificação -->
  <rect x="144" y="114" width="60" height="20" rx="10" ry="10" fill="#0b1329" fill-opacity="0.45"/>
  <circle cx="156" cy="124" r="3.5" fill="#38bdf8"/>
  <rect x="166" y="122" width="26" height="4" rx="2" fill="#e0f2fe" opacity="0.8"/>

  <!-- Brilho sutil contínuo na curvatura superior -->
  <path d="M 64 102 L 192 102"
        stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
