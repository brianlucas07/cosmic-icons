<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Chassi do módulo de texto com cantos arredondados -->
  <rect x="1.5" y="1" width="13" height="14" rx="2.5" ry="2.5" fill="currentColor"/>
  <!-- Linhas de código em realce -->
  <rect x="3.5" y="3.5" width="5.5" height="1.2" rx="0.6" fill="#ffffff"/>
  <rect x="4.5" y="5.8" width="5" height="1.2" rx="0.6" fill="#ffffff" opacity="0.85"/>
  <rect x="4.5" y="8.1" width="3.5" height="1.2" rx="0.6" fill="#ffffff" opacity="0.85"/>
  <rect x="3.5" y="10.4" width="4.5" height="1.2" rx="0.6" fill="#ffffff" opacity="0.6"/>
  <!-- Stylus acoplada na direita -->
  <rect x="12" y="3.5" width="1.2" height="9" rx="0.6" fill="#ffffff" opacity="0.8"/>
  <!-- Faixa de missão sutil na base -->
  <rect x="3.5" y="12.8" width="3.5" height="0.75" rx="0.375" fill="#ffffff" opacity="0.7"/>
