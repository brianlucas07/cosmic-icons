<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em azul cósmico a ciano vibrante -->
    <linearGradient id="help-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#help-body)"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Círculo Interno de Suporte -->
  <circle cx="128" cy="128" r="68" fill="#082f49" opacity="0.5"/>
  <circle cx="128" cy="128" r="68" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>

  <!-- Glifo de Interrogação (?) em Branco Puro + Ponto Âmbar Solar -->
  <path d="M 104 102 C 104 86 115 76 130 76 C 145 76 156 86 156 100 C 156 112 147 118 136 124 C 130 128 128 133 128 142"
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="128" cy="168" r="8" fill="#fbbf24"/>
</svg>
