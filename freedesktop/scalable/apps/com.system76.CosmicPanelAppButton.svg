<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="al_chassis" x1="128" y1="20" x2="128" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="al_cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="al_amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="al_purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="al_teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="al_drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="al_tile_drop" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Squircle Chassis -->
  <rect x="20" y="20" width="216" height="216" rx="28" fill="url(#al_chassis)" filter="url(#al_drop)"/>
  <path d="M 48 21.5 H 208" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <!-- 3x3 Squircle App Grid -->
  <g filter="url(#al_tile_drop)">
    <!-- Row 1 -->
    <rect x="42" y="42" width="48" height="48" rx="13" fill="url(#al_cyan)"/>
    <rect x="104" y="42" width="48" height="48" rx="13" fill="url(#al_amber)"/>
    <rect x="166" y="42" width="48" height="48" rx="13" fill="url(#al_teal)"/>
    <!-- Row 2 -->
    <rect x="42" y="104" width="48" height="48" rx="13" fill="url(#al_amber)"/>
    <rect x="104" y="104" width="48" height="48" rx="13" fill="url(#al_purple)"/>
    <rect x="166" y="104" width="48" height="48" rx="13" fill="url(#al_cyan)"/>
    <!-- Row 3 -->
    <rect x="42" y="166" width="48" height="48" rx="13" fill="url(#al_purple)"/>
    <rect x="104" y="166" width="48" height="48" rx="13" fill="url(#al_teal)"/>
    <rect x="166" y="166" width="48" height="48" rx="13" fill="url(#al_amber)"/>
  </g>
</svg>
