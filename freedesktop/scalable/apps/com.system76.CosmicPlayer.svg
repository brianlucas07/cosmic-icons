<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Moldura principal do reprodutor (Azul cósmico profundo) -->
    <linearGradient id="player-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Tela de cinema interna (Azul-noite espacial) -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060e1c"/>
    </linearGradient>

    <!-- Círculo central do botão Play (Ciano elétrico vibrante) -->
    <linearGradient id="play-disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Barra de progresso reproduzida -->
    <linearGradient id="progress-active" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Sombras suaves de profundidade -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity="0.26"/>
    </filter>

    <filter id="play-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>

    <filter id="knob-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28 — idêntico à família) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#player-body)"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Visor de vídeo interno -->
  <rect x="50" y="52" width="156" height="118" rx="18" ry="18"
        fill="url(#screen-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.28"/>

  <!-- Botão Central de Play -->
  <g filter="url(#play-shadow)">
    <circle cx="128" cy="111" r="34" fill="url(#play-disc)"/>
    <circle cx="128" cy="111" r="33" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.35"/>
    <!-- Triângulo de Play opticamente centralizado com cantos suaves -->
    <path d="M 119 96 L 144 111 L 119 126 Z"
          fill="#ffffff" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- Barra de Progresso (Scrubber) no deck inferior -->
  <rect x="56" y="191" width="144" height="6" rx="3" fill="#041e3a" opacity="0.7"/>
  <rect x="56" y="191" width="94" height="6" rx="3" fill="url(#progress-active)"/>

  <!-- Indicador (Knob) de tempo da reprodução -->
  <circle cx="150" cy="194" r="8" fill="#ffffff" filter="url(#knob-shadow)"/>
  <circle cx="150" cy="194" r="3" fill="#0284c7"/>
</svg>