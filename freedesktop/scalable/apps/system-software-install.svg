<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Degradê da alça da sacola -->
    <linearGradient id="bag-handle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Degradê do corpo da sacola (Ciano a azul cósmico) -->
    <linearGradient id="bag-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Sombra suave e difusa de profundidade -->
    <filter id="shadow-bag" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Alça curva da sacola -->
  <path d="M 96 74 V 46 C 96 32 110 22 128 22 C 146 22 160 32 160 46 V 74"
        stroke="url(#bag-handle)" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Corpo da sacola de aplicativos com cantos bem arredondados (rx 28) -->
  <rect x="38" y="66" width="180" height="158" rx="28" ry="28"
        fill="url(#bag-body)"
        filter="url(#shadow-bag)"/>

  <!-- Rebites de fixação da alça -->
  <circle cx="96" cy="78" r="5" fill="#075985"/>
  <circle cx="96" cy="78" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="160" cy="78" r="5" fill="#075985"/>
  <circle cx="160" cy="78" r="2.5" fill="#ffffff" opacity="0.6"/>

  <!-- Painel central sutil com cantos suaves -->
  <rect x="94" y="112" width="68" height="68" rx="18" ry="18"
        fill="#0b172a" fill-opacity="0.25"/>

  <!-- Seta central de instalação/download em branco nítido -->
  <path d="M 128 126 L 128 154"
        stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 116 144 L 128 156 L 140 144"
        stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="115" y="164" width="26" height="4" rx="2" fill="#38bdf8"/>

  <!-- Friso de luz contínuo na curvatura superior da sacola -->
  <path d="M 64 72 L 192 72"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
</svg>
