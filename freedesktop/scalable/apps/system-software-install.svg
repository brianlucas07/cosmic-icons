<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi do módulo da loja -->
    <linearGradient id="store-chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Câmara interna de instalação de pacotes -->
    <linearGradient id="store-chamber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#0b172a"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Chassi principal com cantos bem arredondados (rx 28) -->
  <rect x="28" y="38" width="200" height="180" rx="28" ry="28"
        fill="url(#store-chassis)"
        filter="url(#shadow)"/>

  <!-- Câmara interna arredondada -->
  <rect x="46" y="56" width="164" height="144" rx="20" ry="20"
        fill="url(#store-chamber)"/>

  <!-- Berço/plataforma de recepção de pacotes -->
  <path d="M 80 132 V 154 C 80 162 86 168 94 168 H 162 C 170 168 176 162 176 154 V 132"
        stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>

  <!-- Feixe e seta de download/instalação em ciano luminoso -->
  <path d="M 128 76 L 128 128"
        stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 110 112 L 128 130 L 146 112"
        stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Indicador sutil de ancoragem no berço -->
  <rect x="110" y="152" width="36" height="4" rx="2" fill="#38bdf8"/>

  <!-- Brilho sutil contínuo na curvatura superior do chassi -->
  <path d="M 56 44 L 200 44"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
</svg>
