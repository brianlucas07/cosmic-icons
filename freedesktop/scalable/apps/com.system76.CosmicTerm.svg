<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi titânio escuro espacial com borda sutil de luz -->
    <linearGradient id="term-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1f38"/>
      <stop offset="100%" stop-color="#070d18"/>
    </linearGradient>

    <!-- Friso de borda sutil ciano/aço -->
    <linearGradient id="term-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Sombra suave e difusa de profundidade -->
    <filter id="shadow-term" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Chassi principal em titânio escuro com cantos bem arredondados (rx 28) -->
  <rect x="34" y="34" width="188" height="188" rx="28" ry="28"
        fill="url(#term-body)"
        stroke="url(#term-border)" stroke-width="2"
        filter="url(#shadow-term)"/>

  <!-- Barra de título integrada moderna com pontos de controle -->
  <circle cx="60" cy="56" r="3.5" fill="#f87171" opacity="0.85"/>
  <circle cx="72" cy="56" r="3.5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="84" cy="56" r="3.5" fill="#34d399" opacity="0.85"/>
  <rect x="110" y="53" width="36" height="6" rx="3" fill="#334155" opacity="0.7"/>

  <!-- Linha divisória ultra-sutil da barra de título -->
  <line x1="42" y1="70" x2="214" y2="70" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Prompt moderno de desenvolvedor: Chevron '❯' em ciano neon -->
  <path d="M 64 104 L 84 120 L 64 136"
        stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Cursor em bloco moderno com alto contraste -->
  <rect x="96" y="108" width="12" height="24" rx="3" fill="#38bdf8"/>

  <!-- Linha de código / saída de comando nítida e contemporânea -->
  <rect x="64" y="156" width="68" height="5.5" rx="2.75" fill="#e0f2fe" opacity="0.9"/>
  <rect x="140" y="156" width="52" height="5.5" rx="2.75" fill="#64748b" opacity="0.5"/>

  <!-- Friso de luz superior acetinado -->
  <path d="M 62 36 L 194 36"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
</svg>
