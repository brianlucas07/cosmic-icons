<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Aro do mostrador em Ciano Vibrante -->
    <linearGradient id="dial-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Mostrador Circular de Precisão -->
  <circle cx="128" cy="128" r="68" fill="#091526" stroke="url(#dial-ring)" stroke-width="4"/>

  <!-- Marcações Horárias -->
  <g stroke="#7dd3fc" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="68" x2="128" y2="76"/>
    <line x1="188" y1="128" x2="180" y2="128"/>
    <line x1="128" y1="188" x2="128" y2="180"/>
    <line x1="68" y1="128" x2="76" y2="128"/>
  </g>

  <!-- Ponteiro de Horas e Minutos (Branco Puro) -->
  <path d="M 128 128 L 102 104" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 128 128 L 160 94" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round"/>

  <!-- Ponteiro de Segundos em Âmbar Solar -->
  <path d="M 128 128 L 128 172" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="128" cy="128" r="6" fill="#fbbf24"/>
</svg>
