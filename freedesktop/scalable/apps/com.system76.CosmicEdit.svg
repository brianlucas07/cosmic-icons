<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi/prancheta do documento (Azul profundo) -->
    <linearGradient id="doc-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Folha interna branca suave com cantos arredondados -->
    <linearGradient id="doc-sheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Sombra principal da folha -->
    <filter id="shadow-doc" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity="0.24"/>
    </filter>

    <!-- Sombra projetada do lápis sobre o documento -->
    <filter id="shadow-pencil" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-3" dy="7" stdDeviation="6" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Prancheta base com cantos bem arredondados (rx 28) -->
  <rect x="42" y="32" width="172" height="192" rx="28" ry="28"
        fill="url(#doc-back)"
        filter="url(#shadow-doc)"/>

  <!-- Folha interna de documento com cantos suaves -->
  <rect x="56" y="46" width="144" height="164" rx="18" ry="18"
        fill="url(#doc-sheet)"/>

  <!-- Linhas sutis de texto diagramadas -->
  <rect x="76" y="72" width="70" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="76" y="88" width="94" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="76" y="104" width="80" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="76" y="120" width="60" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="76" y="136" width="46" height="6" rx="3" fill="#cbd5e1"/>

  <!-- Brilho sutil contínuo na curvatura superior do documento -->
  <path d="M 68 38 L 188 38"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Lápis moderno estilizado cruzando na frente -->
  <g transform="translate(155, 135) rotate(45)" filter="url(#shadow-pencil)">
    <!-- Borracha em tom solar cósmico -->
    <rect x="-11" y="-70" width="22" height="18" rx="7" ry="7" fill="#f59e0b"/>
    <!-- Anel metálico / virola prata acetinada -->
    <rect x="-11" y="-52" width="22" height="12" rx="2" fill="#cbd5e1"/>
    <!-- Corpo do lápis facetado em azul e ciano cósmico -->
    <rect x="-11" y="-40" width="11" height="96" fill="#0284c7"/>
    <rect x="0" y="-40" width="11" height="96" fill="#38bdf8"/>
    <!-- Cone de madeira suave -->
    <path d="M -11 56 L 11 56 L 0 82 Z" fill="#fde68a"/>
    <!-- Ponta de grafite escura -->
    <path d="M -4 72 L 4 72 L 0 82 Z" fill="#0f172a"/>
  </g>
</svg>
