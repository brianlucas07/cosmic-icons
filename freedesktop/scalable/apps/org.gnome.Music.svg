<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Superfície do Disco de Vinil Cósmico -->
    <radialGradient id="vinyl-base" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0b1120"/>
      <stop offset="85%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <!-- Rótulo Central do Disco (Azul Cósmico) -->
    <linearGradient id="disc-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Nota Musical Radiante (Âmbar Solar a Laranja Cósmico) -->
    <linearGradient id="note-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Reflexo Iridiscente do Vinil -->
    <linearGradient id="reflection-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="reflection-purple" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Disco Cósmico de Áudio / Vinil -->
  <circle cx="128" cy="128" r="74" fill="url(#vinyl-base)" stroke="#334155" stroke-width="1.5"/>

  <!-- Ranhuras do Vinil -->
  <circle cx="128" cy="128" r="66" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.4"/>
  <circle cx="128" cy="128" r="58" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.5"/>
  <circle cx="128" cy="128" r="50" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.4"/>
  <circle cx="128" cy="128" r="42" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.5"/>

  <!-- Feixes de Reflexo Iridiscente Angular -->
  <polygon points="128,128 72,80 92,60" fill="url(#reflection-cyan)"/>
  <polygon points="128,128 184,176 164,196" fill="url(#reflection-cyan)"/>
  <polygon points="128,128 184,80 164,60" fill="url(#reflection-purple)"/>
  <polygon points="128,128 72,176 92,196" fill="url(#reflection-purple)"/>

  <!-- Rótulo Central do Disco -->
  <circle cx="128" cy="128" r="28" fill="url(#disc-label)" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="128" cy="128" r="22" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.4"/>
  <circle cx="128" cy="128" r="7" fill="#0f172a" stroke="#f8fafc" stroke-width="1.5"/>

  <!-- Nota Musical Dupla Iluminada (Beamed Eighth Notes) com Brilho Cósmico -->
  <g filter="url(#glow)">
    <!-- Cabeça da nota 1 -->
    <ellipse cx="106" cy="148" rx="13" ry="10" transform="rotate(-20 106 148)" fill="url(#note-grad)"/>
    <!-- Haste 1 -->
    <rect x="114" y="92" width="6" height="56" rx="2" fill="url(#note-grad)"/>

    <!-- Cabeça da nota 2 -->
    <ellipse cx="148" cy="138" rx="13" ry="10" transform="rotate(-20 148 138)" fill="url(#note-grad)"/>
    <!-- Haste 2 -->
    <rect x="156" y="80" width="6" height="58" rx="2" fill="url(#note-grad)"/>

    <!-- Viga de Ligação Superior (Beam) -->
    <polygon points="114,96 162,84 162,72 114,84" fill="url(#note-grad)"/>

    <!-- Brilho especular nas cabeças das notas -->
    <ellipse cx="104" cy="146" rx="6" ry="3" transform="rotate(-20 104 146)" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="146" cy="136" rx="6" ry="3" transform="rotate(-20 146 136)" fill="#ffffff" opacity="0.65"/>
  </g>
</svg>
