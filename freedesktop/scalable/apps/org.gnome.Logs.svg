<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Visor escuro de registros -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091526"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>

    <!-- Aro da lupa de diagnóstico em Ciano Elétrico -->
    <linearGradient id="lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Sombra principal do chassi -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>

    <filter id="lens-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Visor Interno de Logs -->
  <rect x="52" y="54" width="152" height="148" rx="18" ry="18"
        fill="url(#screen-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.28"/>

  <!-- Linhas de Eventos do Sistema (Status + Registro) -->
  <!-- Evento 1 (Info - Ciano) -->
  <circle cx="72" cy="82" r="4.5" fill="#38bdf8"/>
  <rect x="86" y="79" width="84" height="6" rx="3" fill="#e2e8f0" opacity="0.85"/>

  <!-- Evento 2 (Sucesso - Verde Esmeralda) -->
  <circle cx="72" cy="108" r="4.5" fill="#34d399"/>
  <rect x="86" y="105" width="68" height="6" rx="3" fill="#94a3b8" opacity="0.7"/>

  <!-- Evento 3 (Alerta - Âmbar Solar em Destaque) -->
  <circle cx="72" cy="134" r="4.5" fill="#fbbf24"/>
  <rect x="86" y="131" width="92" height="6" rx="3" fill="#fbbf24" opacity="0.9"/>

  <!-- Evento 4 (Info secundário) -->
  <circle cx="72" cy="160" r="4.5" fill="#38bdf8" opacity="0.6"/>
  <rect x="86" y="157" width="54" height="6" rx="3" fill="#64748b" opacity="0.6"/>

  <!-- Lupa de Inspeção de Logs no Canto Inferior Direito -->
  <g filter="url(#lens-shadow)">
    <path d="M 172 172 L 196 196"
          stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
    <circle cx="152" cy="152" r="28" fill="#0b1d36" fill-opacity="0.88"
            stroke="url(#lens-grad)" stroke-width="6"/>
    <!-- Brilho da lente -->
    <path d="M 138 138 A 18 18 0 0 1 162 136"
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
