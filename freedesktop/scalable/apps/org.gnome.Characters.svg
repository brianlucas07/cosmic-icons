<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Tecla traseira em titânio escuro -->
    <linearGradient id="key-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Tecla frontal em ciano vibrante a azul cósmico -->
    <linearGradient id="key-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Sombra suave de profundidade -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Tecla Traseira Squircle (Glifo Omega / Diacrítico) -->
  <g filter="url(#shadow)">
    <rect x="34" y="34" width="132" height="132" rx="26" ry="26"
          fill="url(#key-back)"
          stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.32"/>
    <path d="M 58 40 L 142 40"
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <!-- Glifo 'Ω' / Caractere Especial em Ciano -->
    <path d="M 76 124 H 88 C 80 115 76 104 76 92 C 76 76 87 66 100 66 C 113 66 124 76 124 92 C 124 104 120 115 112 124 H 124"
          fill="none" stroke="#38bdf8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tecla Frontal Squircle (Glifo 'Á' com acento Âmbar Solar) -->
  <g filter="url(#shadow)">
    <rect x="90" y="90" width="132" height="132" rx="26" ry="26"
          fill="url(#key-front)"/>
    <path d="M 114 96 L 198 96"
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <!-- Acento agudo em Âmbar Solar -->
    <path d="M 152 124 L 164 112"
          stroke="#fbbf24" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Letra 'A' geométrica nítida -->
    <path d="M 134 188 L 156 134 L 178 188 M 141 172 H 171"
          fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
