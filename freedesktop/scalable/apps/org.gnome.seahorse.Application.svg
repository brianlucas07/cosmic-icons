<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Anel do Cofre em Ciano Vibrante a Azul Cósmico -->
    <linearGradient id="vault-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Chave / Núcleo em Âmbar Solar -->
    <linearGradient id="key-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Disco de Cofre Criptográfico -->
  <circle cx="128" cy="128" r="66" fill="#091526" stroke="url(#vault-ring)" stroke-width="5"/>
  <circle cx="128" cy="128" r="52" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.45"/>

  <!-- Glifo de Chave Criptográfica Central -->
  <circle cx="106" cy="128" r="20" fill="none" stroke="url(#key-amber)" stroke-width="7"/>
  <path d="M 126 128 H 166 M 150 128 V 142 M 162 128 V 146"
        fill="none" stroke="url(#key-amber)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
