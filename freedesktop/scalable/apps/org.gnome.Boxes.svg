<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Cubo Hipervisor Isométrico (GNOME Boxes) -->
  <!-- Arestas do Cubo Externo -->
  <polygon points="128,60 188,94 188,162 128,196 68,162 68,94"
           fill="#091526" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 68 94 L 128 128 L 188 94 M 128 128 V 196"
        fill="none" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cubo Virtual Interno Suspenso -->
  <polygon points="128,88 160,106 160,144 128,162 96,144 96,106"
           fill="#0284c7" fill-opacity="0.35" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round"/>

  <!-- Nós de Vértice Luminosos -->
  <circle cx="128" cy="60" r="5" fill="#38bdf8"/>
  <circle cx="188" cy="94" r="5" fill="#38bdf8"/>
  <circle cx="188" cy="162" r="5" fill="#38bdf8"/>
  <circle cx="128" cy="196" r="5" fill="#38bdf8"/>
  <circle cx="68" cy="162" r="5" fill="#38bdf8"/>
  <circle cx="68" cy="94" r="5" fill="#38bdf8"/>
  <circle cx="128" cy="128" r="6" fill="#fbbf24"/>
</svg>
