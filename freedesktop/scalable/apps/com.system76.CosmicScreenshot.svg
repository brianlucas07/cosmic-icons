<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Lente Óptica Central em Ciano Vibrante a Azul Cósmico -->
    <linearGradient id="lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Sombra principal do chassi -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>

    <filter id="lens-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Cantoneiras de Seleção / Recorte (Viewfinder Corners) -->
  <g fill="none" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 60 88 V 64 H 84"/>
    <path d="M 172 64 H 196 V 88"/>
    <path d="M 60 168 V 192 H 84"/>
    <path d="M 172 192 H 196 V 168"/>
  </g>

  <!-- Ponto de Gravação / Flash em Âmbar Solar -->
  <circle cx="176" cy="80" r="6" fill="#fbbf24"/>

  <!-- Lente de Captura Central -->
  <g filter="url(#lens-shadow)">
    <circle cx="128" cy="128" r="40" fill="url(#lens-grad)"/>
    <circle cx="128" cy="128" r="32" fill="#091526"/>
    <circle cx="128" cy="128" r="18" fill="url(#lens-grad)" opacity="0.85"/>
    <!-- Reflexo especular da lente -->
    <circle cx="118" cy="118" r="6" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
