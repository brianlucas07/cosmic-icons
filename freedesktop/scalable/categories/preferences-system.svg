<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Gradiente do chassi de titânio escuro com toque cósmico -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gradiente da engrenagem metálica em ciano vibrante cósmico -->
    <linearGradient id="gear-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gradiente do trilho do toggle switch -->
    <linearGradient id="toggle-track" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Sombra principal de profundidade do chassi -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>

    <!-- Sombra projetada da engrenagem sobre a cavidade -->
    <filter id="gear-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>

    <!-- Sombra do botão do toggle -->
    <filter id="knob-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28 — idêntico a Files, Term e Edit) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Cavidade circular rebaixada de maquinário -->
  <circle cx="128" cy="128" r="74" fill="#081426" opacity="0.75"/>
  <circle cx="128" cy="128" r="74" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2" fill="none"/>

  <!-- Engrenagem de Precisão Mecânica (8 dentes simétricos com cantos arredondados) -->
  <g transform="translate(128, 128)" filter="url(#gear-shadow)">
    <!-- Corpo da engrenagem e dentes chanfrados -->
    <g fill="url(#gear-grad)">
      <rect x="-12" y="-66" width="24" height="132" rx="5"/>
      <rect x="-66" y="-12" width="132" height="24" rx="5"/>
      <rect x="-12" y="-66" width="24" height="132" rx="5" transform="rotate(45)"/>
      <rect x="-12" y="-66" width="24" height="132" rx="5" transform="rotate(-45)"/>
      <circle r="52"/>
    </g>

    <!-- Friso de luz usinado concêntrico na face da engrenagem -->
    <circle r="45" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.35"/>

    <!-- Rebaixo concêntrico interno -->
    <circle r="34" fill="#0a192f"/>
    <circle r="34" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.45"/>

    <!-- Toggle Switch de Sintonia do COSMIC no Núcleo -->
    <rect x="-22" y="-11" width="44" height="22" rx="11" fill="url(#toggle-track)"/>
    <rect x="-22" y="-11" width="44" height="22" rx="11" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.3"/>

    <!-- Knob do Toggle Switch (Posição Ativa / Ligado à direita) -->
    <circle cx="9" cy="0" r="8.5" fill="#ffffff" filter="url(#knob-shadow)"/>
    <circle cx="9" cy="0" r="3.5" fill="#38bdf8"/>
  </g>
</svg>