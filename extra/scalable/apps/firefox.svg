<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Gradiente Oficial da Cabeça e Chamas Superiores (Amarelo Solar a Laranja) -->
    <linearGradient id="ff-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff04d"/>
      <stop offset="45%" stop-color="#ff980e"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Gradiente Oficial do Corpo da Raposa de Fogo (Laranja Vivo a Carmim) -->
    <linearGradient id="ff-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7f1f"/>
      <stop offset="60%" stop-color="#f74e66"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>

    <!-- Gradiente da Cauda da Raposa (Magenta a Violeta Escuro) -->
    <linearGradient id="ff-tail-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ff750e"/>
    </linearGradient>

    <!-- Globo Espacial Cósmico Central -->
    <radialGradient id="ff-globe-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>

    <!-- Sombras em Camadas: Profundidade Oclusiva e Glow Solar Âmbar Cósmico -->
    <filter id="firefox-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#080302" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#firefox-shadow)">
    <!-- Geometria Vetorial Nativa do Mozilla Firefox (Escala 4x Oficial) -->
    <g transform="scale(4)">
      <!-- 1. Cabeça e Chama Amarela Superior -->
      <path d="M 40.805 3 C 41.986 6.144 46.257 10.199 51.891 17.415 C 56.662 23.526 57.209 30.344 58.973 36.474 L 45.715 47.885 L 30.740 32.511 C 30.673 22.291 28.220 11.554 40.805 3 Z"
            fill="url(#ff-head-grad)"/>

      <!-- 2. Chama Secundária da Orelha Esquerda -->
      <path d="M 13.538 21.400 C 15.483 19.470 18.659 14.975 22.449 13.730 C 21.431 19.156 22.750 20.881 23.407 23.656 L 17.316 22.077 Z"
            fill="#ff750e"/>

      <!-- 3. Globo Espacial Cósmico Central -->
      <circle cx="32" cy="33" r="14" fill="url(#ff-globe-grad)"/>

      <!-- 4. Chama de Iluminação Interna do Globo -->
      <path d="M 36.435 23.129 C 36.236 23.131 36.037 23.138 35.838 23.151 C 39.893 25.054 42.484 29.127 42.490 33.606 C 42.487 39.761 37.666 44.975 31.520 45.293 C 33.057 46.020 34.735 46.259 36.435 46.264 C 42.824 46.264 48.003 41.085 48.003 34.697 C 48.003 28.308 42.824 23.129 36.435 23.129 Z"
            fill="#ffba36" opacity="0.95"/>

      <!-- 5. Asa/Cauda Inferior em Magenta e Violeta -->
      <path d="M 14.337 23.070 C 7.787 28.135 4 24.470 4 33.327 C 4 48.610 16.536 61 32 61 C 47.464 61 60 48.610 60 33.327 C 60 26.212 57.283 19.723 52.818 14.821 C 52.917 14.817 52.400 14.420 52.134 14.519 C 54.000 17.613 55.075 21.238 55.075 25.115 C 55.075 36.460 48.765 47.700 37.420 47.700 C 30.133 48.053 20.426 43.395 18.932 39.036 C 17.968 36.223 18.211 33.065 20.834 31.316 C 22.258 30.412 24.335 29.519 27.621 29.414 C 30.622 27.440 29.162 27.664 29.017 27.067 C 28.085 26.812 26.430 26.459 24.145 24.661 C 22.121 23.068 21.181 22.464 15.283 22.409 C 14.168 20.263 14.446 25.617 14.337 23.070 Z"
            fill="url(#ff-tail-grad)"/>

      <!-- 6. Corpo Principal da Raposa de Fogo em Laranja Vivo -->
      <path d="M 13.959 11.521 C 7.690 16.370 4.374 23.804 4.033 32.199 C 4.391 45.064 16.135 55 30.600 55 C 45.291 55 57.200 44.744 57.200 31.600 C 57.200 28.057 56.329 24.699 54.777 21.678 C 54.966 22.797 55.075 23.942 55.075 25.115 C 55.075 36.459 45.877 45 34.532 45 C 27.245 45.354 21.763 41.986 20.269 37.627 C 19.306 34.814 19.621 33.627 22.244 31.879 C 23.668 30.975 25.674 30.362 28.959 30.257 C 31.961 28.284 32.191 27.525 32.046 26.927 C 31.114 26.672 28.543 25.685 26.258 23.887 C 24.234 22.294 20.875 19.082 14.977 19.027 C 13.862 16.882 14.068 14.069 13.959 11.521 Z"
            fill="url(#ff-body-grad)"/>

      <!-- 7. Mecha de Fogo Dourada Frontal -->
      <path d="M 16.512 25.008 C 14.606 24.966 13.001 25.623 11.727 26.492 C 11.498 26.720 13.542 30.850 17.801 30.895 C 17.406 37.764 22.548 42.787 26 43.781 L 27.516 44.059 C 23.846 42.800 21.229 40.424 20.270 37.625 C 19.306 34.813 19.620 33.627 22.242 31.879 C 23.667 30.975 25.671 30.363 28.957 30.258 C 30.458 29.271 31.269 28.586 31.684 28.074 C 31.891 27.819 31.999 27.608 32.047 27.422 C 32.095 27.236 32.083 27.075 32.047 26.926 C 28.001 31.000 22.257 26.517 17.805 25.152 C 17.386 25.063 16.951 25.017 16.512 25.008 Z"
            fill="#ffde3f"/>

      <!-- Friso de Luz Especular Contínuo no Topo da Crista da Raposa de Fogo -->
      <path d="M 40.805 3 C 41.986 6.144 46.257 10.199 51.891 17.415 C 56.453 23.258 57.163 29.743 58.758 35.660"
            fill="none" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" stroke-opacity="0.6"/>

      <!-- Friso de Luz Especular na Curva Superior da Cauda -->
      <path d="M 13.959 11.521 C 7.690 16.370 4.374 23.804 4.033 32.199"
            fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" stroke-opacity="0.5"/>
    </g>
  </g>
</svg>
