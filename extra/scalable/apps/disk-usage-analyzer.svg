<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Setor Principal (Ciano Elétrico a Azul Cósmico) -->
    <linearGradient id="sector-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Setor Secundário (Púrpura / Índigo Cósmico) -->
    <linearGradient id="sector-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Setor de Destaque (Âmbar Solar) -->
    <linearGradient id="sector-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Sombra principal do chassi -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>

    <filter id="ring-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Cavidade escura do gráfico de anéis -->
  <circle cx="128" cy="128" r="70" fill="#070f1d"/>

  <!-- Gráfico Sunburst / Anéis de Uso de Disco (Baobab) -->
  <g filter="url(#ring-shadow)">
    <!-- Setor Maior Ciano (Esquerda / Inferior) -->
    <path d="M 128 64 A 64 64 0 1 0 192 128 H 154 A 26 26 0 1 1 128 102 Z"
          fill="url(#sector-cyan)"/>

    <!-- Setor Superior Direito em Âmbar Solar (Destacado levemente) -->
    <path d="M 134 58 A 64 64 0 0 1 198 122 H 160 A 26 26 0 0 0 134 96 Z"
          fill="url(#sector-amber)"/>

    <!-- Anel Externo Secundário (Subdiretórios em Índigo Cósmico) -->
    <path d="M 64 128 A 64 64 0 0 0 128 192 V 176 A 48 48 0 0 1 80 128 Z"
          fill="url(#sector-purple)"/>

    <!-- Núcleo Central Escuro com Ponto Luminoso -->
    <circle cx="128" cy="128" r="22" fill="#0f172a"/>
    <circle cx="128" cy="128" r="8" fill="#38bdf8"/>
  </g>
</svg>
