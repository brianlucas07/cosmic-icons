<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Núcleo de Silício em Ciano Vibrante a Azul Cósmico -->
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Pinos de Contato em Âmbar Solar (4 lados do Microcontrolador) -->
  <g fill="#fbbf24">
    <!-- Topo e Base -->
    <rect x="94" y="64" width="10" height="20" rx="3"/>
    <rect x="123" y="64" width="10" height="20" rx="3"/>
    <rect x="152" y="64" width="10" height="20" rx="3"/>
    <rect x="94" y="172" width="10" height="20" rx="3"/>
    <rect x="123" y="172" width="10" height="20" rx="3"/>
    <rect x="152" y="172" width="10" height="20" rx="3"/>
    <!-- Esquerda e Direita -->
    <rect x="64" y="94" width="20" height="10" rx="3"/>
    <rect x="64" y="123" width="20" height="10" rx="3"/>
    <rect x="64" y="152" width="20" height="10" rx="3"/>
    <rect x="172" y="94" width="20" height="10" rx="3"/>
    <rect x="172" y="123" width="20" height="10" rx="3"/>
    <rect x="172" y="152" width="20" height="10" rx="3"/>
  </g>

  <!-- Encapsulamento do Chip de Firmware -->
  <rect x="80" y="80" width="96" height="96" rx="16" fill="#091526" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="98" y="98" width="60" height="60" rx="10" fill="url(#chip-grad)"/>
  <circle cx="112" cy="112" r="4" fill="#ffffff"/>
</svg>
