<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Prato magnético rotativo em ciano vibrante a azul cósmico -->
    <linearGradient id="platter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Braço atuador de leitura em Âmbar Solar -->
    <linearGradient id="actuator-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Sombra principal do chassi -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>

    <!-- Sombra interna projetada -->
    <filter id="part-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Parafusos técnicos de canto do drive -->
  <circle cx="56" cy="56" r="4" fill="#334155"/>
  <circle cx="200" cy="56" r="4" fill="#334155"/>
  <circle cx="56" cy="200" r="4" fill="#334155"/>
  <circle cx="200" cy="200" r="4" fill="#334155"/>

  <!-- Cavidade circular do prato magnético -->
  <circle cx="128" cy="122" r="66" fill="#070f1d"/>

  <!-- Prato Magnético Ciano Cósmico -->
  <g filter="url(#part-shadow)">
    <circle cx="128" cy="122" r="58" fill="url(#platter-grad)"/>
    <!-- Reflexos especulares de rotação -->
    <circle cx="128" cy="122" r="44" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.25"/>
    <circle cx="128" cy="122" r="30" fill="none" stroke="#bae6fd" stroke-width="1" stroke-dasharray="18 12" opacity="0.4"/>
    <!-- Eixo central (Spindle) -->
    <circle cx="128" cy="122" r="16" fill="#0f172a"/>
    <circle cx="128" cy="122" r="7" fill="#e2e8f0"/>
  </g>

  <!-- Braço Atuador de Precisão (Actuator Arm) -->
  <g filter="url(#part-shadow)">
    <path d="M 74 182 L 118 136 L 124 142 L 84 190 Z" fill="url(#actuator-grad)"/>
    <circle cx="78" cy="184" r="12" fill="#f8fafc"/>
    <circle cx="78" cy="184" r="5" fill="#0f172a"/>
  </g>

  <!-- LED de atividade do drive no canto inferior direito -->
  <rect x="156" y="194" width="24" height="6" rx="3" fill="#38bdf8"/>
</svg>
