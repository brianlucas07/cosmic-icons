<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Bisel metálico da lente -->
    <linearGradient id="bezel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Anel cósmico azul/ciano -->
    <linearGradient id="cosmic-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Vidro óptico profundo com reflexo estelar -->
    <radialGradient id="lens-glass" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#0b1e3b"/>
      <stop offset="85%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#075985"/>
    </radialGradient>

    <!-- Flash / Sensor Âmbar Solar -->
    <linearGradient id="flash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Friso de luz especular superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Flash Refletor / Luz de Apoio Superior Direito -->
  <rect x="170" y="54" width="28" height="18" rx="6"
        fill="url(#flash-grad)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="184" cy="63" r="4" fill="#ffffff" opacity="0.75"/>

  <!-- LED Indicador Tally / Atividade Cósmica -->
  <circle cx="62" cy="63" r="5" fill="#ef4444"/>
  <circle cx="62" cy="63" r="2.5" fill="#ffffff" opacity="0.8"/>

  <!-- Grip de Empunhadura Lateral Metálico -->
  <rect x="42" y="90" width="8" height="76" rx="4" fill="#334155" opacity="0.6"/>

  <!-- Barril Externo da Lente (Bisel Dentado / Ranhurado) -->
  <circle cx="128" cy="136" r="62" fill="url(#bezel-grad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Marcações de Calibração / Ranhuras da Lente -->
  <circle cx="128" cy="136" r="56" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Anel Cósmico Neon -->
  <circle cx="128" cy="136" r="48" fill="none" stroke="url(#cosmic-ring)" stroke-width="3"/>

  <!-- Vidro da Lente Óptica com Reflexão -->
  <circle cx="128" cy="136" r="44" fill="url(#lens-glass)"/>

  <!-- Elemento Central do Sensor / Diafragma -->
  <circle cx="128" cy="136" r="24" fill="#020617" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="128" cy="136" r="12" fill="#0284c7" opacity="0.85"/>
  <circle cx="128" cy="136" r="6" fill="#38bdf8"/>

  <!-- Reflexo Especular da Curvatura da Lente (Glint Óptico) -->
  <path d="M 104 116 C 112 108 126 104 140 106 C 146 107 149 109 152 112"
        fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="110" cy="122" r="3" fill="#ffffff" opacity="0.6"/>
</svg>
