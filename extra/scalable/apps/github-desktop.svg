<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Recorte do Chassi Squircle Nativo do GitHub Desktop -->
    <clipPath id="gh-clip">
      <rect x="28" y="28" width="200" height="200" rx="44" ry="44"/>
    </clipPath>

    <!-- Gradiente Oficial Violeta Cósmico do GitHub Desktop -->
    <linearGradient id="gh-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="40%" stop-color="#7e22ce"/>
      <stop offset="80%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Linhas Tecnológicas de Commit / Git Branch Cósmico -->
    <linearGradient id="branch-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Sombras em Camadas: Profundidade e Glow Violeta Neon -->
    <filter id="github-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#060210" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#9333ea" flood-opacity="0.35"/>
    </filter>

    <filter id="octocat-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#github-shadow)">
    <!-- Conteúdo Interno Delimitado pelo Squircle (Sem Vazamento) -->
    <g clip-path="url(#gh-clip)">
      <!-- Base Roxa Oficial -->
      <rect x="28" y="28" width="200" height="200" fill="url(#gh-purple)"/>

      <!-- Detalhes Técnicos de Rede Git / Linhas de Ramificação (Branching) -->
      <path d="M 50 190 C 80 190 90 140 128 140 C 166 140 176 90 206 90"
            fill="none" stroke="url(#branch-line)" stroke-width="2" stroke-dasharray="4,4"/>
      <circle cx="50" cy="190" r="4" fill="#c084fc" opacity="0.4"/>
      <circle cx="128" cy="140" r="4" fill="#c084fc" opacity="0.4"/>
      <circle cx="206" cy="90" r="4" fill="#c084fc" opacity="0.4"/>

      <!-- Silhueta Vetorial Autêntica do Octocat Enquadrada Perfeitamente Dentro do Squircle -->
      <g transform="translate(17.5, 0) scale(3.4)" filter="url(#octocat-glow)">
        <path d="M 46.820 18.006 C 45.968 17.966 43.567 18.251 39.814 20.861 C 37.715 20.228 35.319 19.994 32.820 20 C 30.535 20.006 28.165 20.193 25.861 20.861 C 22.107 18.251 20.189 17.968 19.336 18.008 C 19.052 18.021 18.914 18.064 18.914 18.064 C 17.487 21.767 18.390 24.505 18.660 25.186 C 16.984 27.065 16 29.464 16 32.400 C 16 42.708 22.679 45.017 28.498 45.695 C 27.750 46.367 27.279 47.757 27.041 49.494 C 25.548 50.183 21.543 51.868 19.205 47.758 C 19.205 47.758 17.822 45.174 15.191 44.984 C 15.191 44.984 12.634 44.951 15.014 46.619 C 15.014 46.619 16.732 47.447 17.924 50.555 C 17.924 50.555 19.694 55.285 26.984 53.660 C 26.992 54.922 26.998 57.275 27.004 59.551 C 28.625 59.841 30.293 60 32 60 C 34.782 60 37.463 59.592 39.996 58.844 C 40.004 56.069 40.012 52.792 40.012 50.656 C 40.012 48.148 38.975 46.506 38.035 45.676 C 43.872 45.010 50 42.734 50 32.400 C 50 29.464 49.184 27.063 47.504 25.184 C 47.773 24.503 48.674 21.767 47.244 18.064 C 47.244 18.064 47.106 18.019 46.822 18.006 Z"
              fill="#ffffff"/>
      </g>
    </g>

    <!-- Borda Externa Sutil de Acabamento Metálico -->
    <rect x="28" y="28" width="200" height="200" rx="44" ry="44"
          fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25"/>

    <!-- Friso de Luz Especular Contínuo no Topo (Assinatura Cósmica) -->
    <path d="M 64 36 L 192 36"
          stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
