<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Recorte do Chassi Squircle Nativo JetBrains -->
    <clipPath id="squircle-clip">
      <rect x="28" y="28" width="200" height="200" rx="44" ry="44"/>
    </clipPath>

    <!-- Placa Central com Gradiente Espacial Profundo -->
    <linearGradient id="center-tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3d"/>
      <stop offset="100%" stop-color="#141720"/>
    </linearGradient>

    <!-- Sombras em Camadas: Profundidade e Glow Nativo RustRover -->
    <filter id="rr-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050811" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fe4b71" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#rr-shadow)">
    <!-- Base Squircle Nativa com os 4 Quadrantes Oficiais do JetBrains RustRover -->
    <g clip-path="url(#squircle-clip)">
      <!-- Quadrante Superior Esquerdo: Coral/Rubi Oficial -->
      <rect x="28" y="28" width="100" height="100" fill="#fe4b71"/>
      <!-- Quadrante Superior Direito: Verde Esmeralda Oficial -->
      <rect x="128" y="28" width="100" height="100" fill="#21d789"/>
      <!-- Quadrante Inferior Esquerdo: Âmbar Dourado Oficial -->
      <rect x="28" y="128" width="100" height="100" fill="#f7c73c"/>
      <!-- Quadrante Inferior Direito: Verde Lima Oficial -->
      <rect x="128" y="128" width="100" height="100" fill="#a2e36e"/>

      <!-- Linhas de Junção entre Facetas -->
      <line x1="128" y1="28" x2="128" y2="228" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.2"/>
      <line x1="28" y1="128" x2="228" y2="128" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.2"/>
    </g>

    <!-- Borda Externa Sutil de Acabamento Metálico -->
    <rect x="28" y="28" width="200" height="200" rx="44" ry="44"
          fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25"/>

    <!-- Friso de Luz Especular Contínuo no Topo (Assinatura Cósmica) -->
    <path d="M 64 36 L 192 36"
          stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" opacity="0.45"/>

    <!-- Placa Central Preta / Terminal Oficial JetBrains -->
    <rect x="68" y="68" width="120" height="120" rx="18"
          fill="url(#center-tile)" stroke="#f7c73c" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- Monograma Oficial "RR" do RustRover -->
    <!-- Primeiro R -->
    <path d="M 86 96 H 106 C 115 96 120 101 120 109 C 120 115 116 120 109 121 L 122 142 H 110 L 99 124 H 96 V 142 H 86 Z M 96 106 V 115 H 105 C 109 115 111 113 111 110.5 C 111 108 109 106 105 106 Z"
          fill="#ffffff"/>

    <!-- Segundo R -->
    <path d="M 132 96 H 152 C 161 96 166 101 166 109 C 166 115 162 120 155 121 L 168 142 H 156 L 145 124 H 142 V 142 H 132 Z M 142 106 V 115 H 151 C 155 115 157 113 157 110.5 C 157 108 155 106 151 106 Z"
          fill="#ffffff"/>

    <!-- Cursor Terminal JetBrains (_) -->
    <rect x="86" y="156" width="34" height="5" rx="2" fill="#ffffff"/>
  </g>
</svg>
