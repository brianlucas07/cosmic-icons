<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chassi em titânio escuro espacial -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Cabeçalho do Calendário em Ciano Vibrante a Azul Cósmico -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Dia Atual em Âmbar Solar -->
    <linearGradient id="day-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Chassi Base Squircle (rx 28) -->
  <rect x="36" y="36" width="184" height="184" rx="28" ry="28"
        fill="url(#chassis-grad)"
        stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"
        filter="url(#shadow)"/>

  <!-- Cabeçalho Superior Arredondado -->
  <path d="M 64 36 H 192 C 207.5 36 220 48.5 220 64 V 92 H 36 V 64 C 36 48.5 48.5 36 64 36 Z"
        fill="url(#header-grad)"/>

  <!-- Friso de luz especular contínuo na curvatura superior -->
  <path d="M 64 42 L 192 42"
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Pinos / Argolas Superiores de Encadernação -->
  <rect x="82" y="28" width="12" height="26" rx="6" fill="#f8fafc"/>
  <rect x="162" y="28" width="12" height="26" rx="6" fill="#f8fafc"/>

  <!-- Grade de Dias do Mês -->
  <g fill="#475569">
    <!-- Linha 1 -->
    <rect x="64" y="114" width="24" height="20" rx="6"/>
    <rect x="100" y="114" width="24" height="20" rx="6"/>
    <rect x="136" y="114" width="24" height="20" rx="6" fill="#38bdf8" opacity="0.85"/>
    <rect x="172" y="114" width="20" height="20" rx="6"/>
    <!-- Linha 2 -->
    <rect x="64" y="146" width="24" height="20" rx="6"/>
    <rect x="136" y="146" width="24" height="20" rx="6"/>
    <rect x="172" y="146" width="20" height="20" rx="6"/>
    <!-- Linha 3 -->
    <rect x="64" y="178" width="24" height="20" rx="6"/>
    <rect x="100" y="178" width="24" height="20" rx="6" fill="#38bdf8" opacity="0.5"/>
    <rect x="136" y="178" width="24" height="20" rx="6"/>
  </g>

  <!-- Dia Atual em Destaque (Âmbar Solar) -->
  <rect x="96" y="142" width="32" height="28" rx="8" fill="url(#day-amber)"/>
  <circle cx="112" cy="156" r="4.5" fill="#ffffff"/>
</svg>
