<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="zen-clip">
      <rect x="28" y="28" width="200" height="200" rx="44" ry="44"/>
    </clipPath>
    <linearGradient id="zen-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c30"/>
      <stop offset="45%" stop-color="#202022"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="zen-cream" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#faf8f0"/>
      <stop offset="55%" stop-color="#f2f0e3"/>
      <stop offset="100%" stop-color="#d4d0be"/>
    </linearGradient>
    <filter id="zen-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050811" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#f2f0e3" flood-opacity="0.16"/>
    </filter>
    <filter id="zen-ring-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#zen-shadow)">
    <g clip-path="url(#zen-clip)">
      <rect x="28" y="28" width="200" height="200" fill="url(#zen-bg)"/>
      <!-- Anel orbital técnico sutil -->
      <circle cx="128" cy="128" r="84" fill="none" stroke="#f2f0e3" stroke-width="1" stroke-dasharray="3,6" opacity="0.18"/>
      <!-- 3 Anéis Concêntricos Oficiais do Zen Browser -->
      <g filter="url(#zen-ring-depth)" fill="url(#zen-cream)" fill-rule="evenodd">
        <path d="M 128 56 A 72 72 0 1 0 128 200 A 72 72 0 1 0 128 56 Z M 128 74 A 54 54 0 1 1 128 182 A 54 54 0 1 1 128 74 Z"/>
        <path d="M 128 84 A 44 44 0 1 0 128 172 A 44 44 0 1 0 128 84 Z M 128 98 A 30 30 0 1 1 128 158 A 30 30 0 1 1 128 98 Z"/>
        <path d="M 128 108 A 20 20 0 1 0 128 148 A 20 20 0 1 0 128 108 Z M 128 118 A 10 10 0 1 1 128 138 A 10 10 0 1 1 128 118 Z"/>
      </g>
      <!-- Realce especular nos anéis -->
      <path d="M 78 78 A 71 71 0 0 1 178 78" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
      <path d="M 98 98 A 43 43 0 0 1 158 98" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
    </g>
    <!-- Micro-borda metálica e friso especular superior -->
    <rect x="28" y="28" width="200" height="200" rx="44" ry="44" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.22"/>
    <path d="M 64 36 L 192 36" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
