<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Gradiente Oficial Nativo JetBrains Toolbox (Laranja a Magenta a Violeta) -->
    <linearGradient id="jb-cube-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="5%" stop-color="#ff8618"/>
      <stop offset="42%" stop-color="#ff246e"/>
      <stop offset="95%" stop-color="#af1df5"/>
    </linearGradient>

    <!-- Face de Sombra do Cubo com Tom Espacial Profundo -->
    <linearGradient id="jb-cube-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230"/>
      <stop offset="60%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Brilho Especular Superior de Vidro Cósmico -->
    <linearGradient id="specular-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Sombras em Camadas: Profundidade e Glow Neon Cósmico -->
    <filter id="toolbox-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050811" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#ff246e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#toolbox-shadow)">
    <!-- Face Direita / Sombra do Cubo 3D -->
    <polygon points="128,136 224,82 224,190 128,244" fill="url(#jb-cube-dark)"/>

    <!-- Detalhes Oficiais de Corte / Degraus em Branco na Face Direita -->
    <polygon points="196,128 152,153 152,134 196,109" fill="#ffffff"/>
    <polygon points="152,164 152,181 190,159 190,142" fill="#ffffff" opacity="0.95"/>

    <!-- Face Principal Frontal / Superior Nativa JetBrains -->
    <path d="M 128 28 L 32 82 V 190 L 128 244 L 128 136 L 224 82 Z" fill="url(#jb-cube-grad)"/>

    <!-- Friso Especular Cósmico de Curvatura / Aresta Superior -->
    <path d="M 44 86 L 128 38 L 212 86"
          fill="none" stroke="url(#specular-line)" stroke-width="3" stroke-linecap="round"/>

    <!-- Bisel de Luz na Aresta Central Vertical -->
    <line x1="128" y1="136" x2="128" y2="242"
          stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Ponto de Brilho Estelar no Vértice Superior -->
    <circle cx="128" cy="38" r="3" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
