<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Gradiente Oficial do Blueprint do Android Studio (Azul Royal a Ciano) -->
    <radialGradient id="blueprint-base" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="55%" stop-color="#1a56db"/>
      <stop offset="90%" stop-color="#034eca"/>
      <stop offset="100%" stop-color="#022e80"/>
    </radialGradient>

    <!-- Verde Oficial do Bugdroid Android -->
    <linearGradient id="android-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55eb99"/>
      <stop offset="45%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#1cb863"/>
    </linearGradient>

    <!-- Pernas Metálicas do Compasso Técnico com Bisel Aeroespacial -->
    <linearGradient id="compass-leg-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="compass-leg-right" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Sombras em Camadas: Profundidade e Glow Azul Cósmico -->
    <filter id="studio-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020d26" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#4285f4" flood-opacity="0.3"/>
    </filter>

    <filter id="antenna-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3ddc84" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#studio-shadow)">
    <!-- Prancha Blueprint Circular Nativa do Android Studio -->
    <circle cx="128" cy="128" r="98" fill="url(#blueprint-base)"/>

    <!-- Detalhes Técnicos de Grade e Calibração Blueprint Cósmica -->
    <circle cx="128" cy="128" r="88" fill="none" stroke="#73a7ff" stroke-width="0.8" stroke-dasharray="6,4" opacity="0.45"/>
    <circle cx="128" cy="128" r="74" fill="none" stroke="#73a7ff" stroke-width="0.7" opacity="0.3"/>
    <line x1="30" y1="128" x2="226" y2="128" stroke="#73a7ff" stroke-width="0.7" stroke-dasharray="4,6" opacity="0.35"/>
    <line x1="128" y1="30" x2="128" y2="226" stroke="#73a7ff" stroke-width="0.7" stroke-dasharray="4,6" opacity="0.35"/>

    <!-- Friso Especular Contínuo no Arco Superior do Disco -->
    <path d="M 64 56 C 82 42 104 34 128 34 C 152 34 174 42 192 56"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

    <!-- Compasso de Engenharia Arquitetônica (Divider) -->
    <!-- Perna Esquerda com Marcas de Precisão -->
    <path d="M 124 54 L 72 192 L 84 195 L 132 66 Z" fill="url(#compass-leg-left)"/>
    <polygon points="69,191 73,203 78,193" fill="#f8fafc"/>

    <!-- Perna Direita com Marcas de Precisão -->
    <path d="M 132 54 L 184 192 L 172 195 L 124 66 Z" fill="url(#compass-leg-right)"/>
    <polygon points="187,191 183,203 178,193" fill="#f8fafc"/>

    <!-- Dobradiça / Cabeça de Articulação do Compasso -->
    <circle cx="128" cy="54" r="16" fill="#64748b" stroke="#e2e8f0" stroke-width="2.5"/>
    <circle cx="128" cy="54" r="7" fill="#f8fafc"/>

    <!-- Cabeça Oficial do Bugdroid Android -->
    <g filter="url(#antenna-glow)">
      <!-- Antena Esquerda com Brilho Estelar -->
      <line x1="106" y1="122" x2="94" y2="102" stroke="#3ddc84" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="94" cy="102" r="3" fill="#ffffff" opacity="0.75"/>

      <!-- Antena Direita com Brilho Estelar -->
      <line x1="150" y1="122" x2="162" y2="102" stroke="#3ddc84" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="162" cy="102" r="3" fill="#ffffff" opacity="0.75"/>

      <!-- Cúpula da Cabeça do Android (Semicírculo Oficial) -->
      <path d="M 92 156 C 92 122 164 122 164 156 Z" fill="url(#android-green)"/>

      <!-- Friso de Luz Especular na Cúpula do Bugdroid -->
      <path d="M 104 135 C 112 127 144 127 152 135"
            fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

      <!-- Olhos do Bugdroid -->
      <circle cx="112" cy="144" r="4" fill="#034eca"/>
      <circle cx="144" cy="144" r="4" fill="#034eca"/>
    </g>
  </g>
</svg>
