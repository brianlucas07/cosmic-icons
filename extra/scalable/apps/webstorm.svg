<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Recorte do Chassi Squircle Nativo JetBrains -->
    <clipPath id="squircle-clip">
      <rect x="28" y="28" width="200" height="200" rx="44" ry="44"/>
    </clipPath>

    <!-- Gradientes Oficiais das Facetas do WebStorm -->
    <linearGradient id="ws-facet-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cdd7"/>
      <stop offset="50%" stop-color="#087cfa"/>
      <stop offset="100%" stop-color="#003899"/>
    </linearGradient>

    <linearGradient id="ws-facet-deep" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#087cfa"/>
      <stop offset="100%" stop-color="#001a4d"/>
    </linearGradient>

    <!-- Placa Central com Gradiente Espacial Profundo -->
    <linearGradient id="center-tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3d"/>
      <stop offset="100%" stop-color="#141720"/>
    </linearGradient>

    <!-- Sombras em Camadas: Profundidade e Glow Ciano/Azul do WebStorm -->
    <filter id="ws-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050811" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00cdd7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#ws-shadow)">
    <!-- Base Squircle Nativa com a Geometria Angular Oficial do WebStorm -->
    <g clip-path="url(#squircle-clip)">
      <!-- Fundo Base Azul Cobalto Profundo -->
      <rect x="28" y="28" width="200" height="200" fill="url(#ws-facet-deep)"/>

      <!-- Faceta Amarela Solar Oficial -->
      <polygon points="28,28 140,28 28,150" fill="#f0eb18"/>

      <!-- Faceta Angular Ciano a Azul Vibrante -->
      <polygon points="120,28 228,28 228,160 50,228 28,228 28,170" fill="url(#ws-facet-blue)"/>

      <!-- Linhas de Junção entre Facetas -->
      <line x1="28" y1="150" x2="140" y2="28" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.25"/>
    </g>

    <!-- Borda Externa Sutil de Acabamento Metálico -->
    <rect x="28" y="28" width="200" height="200" rx="44" ry="44"
          fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25"/>

    <!-- Friso de Luz Especular Contínuo no Topo (Assinatura Cósmica) -->
    <path d="M 64 36 L 192 36"
          stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" opacity="0.45"/>

    <!-- Placa Central Preta / Terminal Oficial JetBrains -->
    <rect x="68" y="68" width="120" height="120" rx="18"
          fill="url(#center-tile)" stroke="#00cdd7" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- Tipografia Vetorial Oficial Autêntica JetBrains "WS" e Cursor Terminal -->
    <g transform="translate(32, 32) scale(3)">
      <!-- Letras "WS" Oficiais da JetBrains com Curvas Vetoriais Idênticas -->
      <path d="M18.8222 17.0078L21.2445 27.961L23.8277 17.0078H26.7857L29.4865 27.961L31.8337 17.0078H34.8027L31.1585 32.0122H27.8255L25.2964 21.1124L22.735 32.0122H19.4124L15.79 17.0078H18.8233H18.8222ZM41.123 32.27C40.0367 32.27 39.0721 32.0731 38.2292 31.6804C37.3933 31.2876 36.7358 30.737 36.257 30.0297C35.7856 29.3223 35.5428 28.5076 35.5284 27.5861H38.4652C38.4652 28.0213 38.5795 28.4048 38.808 28.7327C39.0365 29.0611 39.3546 29.3183 39.7617 29.5043C40.1687 29.6903 40.6367 29.7828 41.1655 29.7828C41.6943 29.7828 42.1157 29.7013 42.4946 29.5365C42.8805 29.3648 43.1767 29.1294 43.384 28.8291C43.5982 28.5288 43.7055 28.1861 43.7055 27.8002C43.7055 27.3219 43.5591 26.9252 43.2663 26.6106C42.9804 26.2959 42.5842 26.0789 42.0767 25.9566L39.4292 25.3669C38.715 25.2102 38.0932 24.9421 37.5644 24.5631C37.0356 24.1773 36.625 23.7019 36.3316 23.1375C36.0388 22.5737 35.8924 21.9369 35.8924 21.2296C35.8924 20.3724 36.114 19.6047 36.5567 18.9255C37 18.2394 37.6178 17.7077 38.4107 17.3288C39.2036 16.9429 40.1039 16.75 41.1115 16.75C42.1191 16.75 43.0441 16.936 43.8445 17.3075C44.6449 17.6784 45.2661 18.1969 45.7093 18.8617C46.1595 19.5197 46.388 20.2765 46.3955 21.1337H43.4696C43.4696 20.7691 43.3731 20.4436 43.1802 20.1582C42.9873 19.8648 42.7122 19.6397 42.3551 19.483C42.0049 19.3182 41.6013 19.2367 41.1442 19.2367C40.6872 19.2367 40.283 19.3159 39.9333 19.4727C39.5906 19.6225 39.3224 19.8372 39.1295 20.1157C38.9366 20.3879 38.8401 20.7054 38.8401 21.0694C38.8401 21.4833 38.9722 21.8261 39.2369 22.0983C39.5085 22.3704 39.8765 22.5633 40.341 22.677L42.892 23.2345C43.628 23.3844 44.2814 23.6697 44.8533 24.0917C45.432 24.5057 45.8822 25.0202 46.2037 25.6351C46.5252 26.242 46.686 26.9063 46.686 27.6285C46.686 28.5139 46.45 29.3114 45.9786 30.0188C45.5141 30.7192 44.8602 31.2687 44.0173 31.6695C43.1744 32.0702 42.2099 32.2695 41.1236 32.2695L41.123 32.27Z"
            fill="#ffffff"/>

      <!-- Cursor Sublinhado Oficial do Terminal (_) -->
      <path d="M33 44H17V47H33V44Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
